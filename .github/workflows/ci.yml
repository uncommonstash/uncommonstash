name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      TZ: UTC
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          persist-credentials: false
      - name: Set SOURCE_DATE_EPOCH from commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
        with:
          version: 10.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-inputs.mjs
      - run: node scripts/validate-tools.mjs
      - run: pnpm lint
      - run: npx tsc -b --pretty false
      - run: pnpm test --runInBand --silent
      - run: pnpm build
      - name: Guard against absolute paths / sourcemaps in dist
        run: |
          if find dist -name '*.map' | grep -q .; then
            echo "ERROR: sourcemap files found in dist/ (can embed absolute paths)"; exit 1
          fi
          if grep -rIl --fixed-strings "$GITHUB_WORKSPACE" dist/ | grep -q .; then
            echo "ERROR: absolute checkout path leaked into dist/"; exit 1
          fi
          if grep -rIl --fixed-strings '/home/runner' dist/ | grep -q .; then
            echo "ERROR: runner absolute path leaked into dist/"; exit 1
          fi
          echo "path guard: clean"
      - name: Verify reproducible build (double-build gate)
        run: node scripts/verify-reproducible.mjs
