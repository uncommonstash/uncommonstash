<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="uncommonstash">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" rx="32" fill="#0b0b0c"/>
  <rect width="1200" height="420" rx="32" fill="url(#grid)"/>
  <rect x="100" y="30" width="1000" height="360" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="418" rx="31" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>

  <!-- brand mark (scaled logo): square frame + cross -->
  <g transform="translate(298, 162)" stroke="#fafafa" stroke-width="11" fill="none" stroke-linecap="square">
    <rect x="5.5" y="5.5" width="85" height="85"/>
    <path d="M48 0V96"/>
    <path d="M0 48H96"/>
  </g>

  <!-- wordmark -->
  <text x="428" y="248" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="650" letter-spacing="-1" fill="#fafafa">uncommonstash</text>
</svg>
